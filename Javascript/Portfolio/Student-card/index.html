<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-box">
        <input type="text" id="nameInput" placeholder="Enter Your Name">
        <input type="text" id="regInput" placeholder="Enter Reg No">
        <input type="text" id="courseInput" placeholder="Enter Course">
        <button id="updateBtn">Update Card</button>
    </div>
    <div class="card">
        <div class="card-header">
            <h2>MASENO UNIVERSITY</h2>
            <p>Student Identity Card</p>
        </div>
        <div class="card-body">
            <img src="Profile.jpeg" alt="Student Photo" class="profile-img">
            <div class="info">
                <h3>Clinton Mwathi</h3>
                <p><strong>Reg No:</strong> CI/00123/2022</p>
                <p><strong>Course:</strong> Computer Science</p>
                <p><strong>School:</strong> Computing & Informatics</p>
                <p><strong>Valid:</strong> 2022 - 2026</p>
            </div>
        </div>
        <div class="card-footer">
            <p>This card is property of Maseno University</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
